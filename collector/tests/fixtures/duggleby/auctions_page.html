<script>
        // ---- Data: fetch every upcoming auction once by paging to exhaustion ----
        async function fetchAllAuctions() {
            const results = [];
            const maxPages = 50; // safety cap (~1000 auctions)
            let page = 0;

            while (page < maxPages) {
                const response = await fetch('/api/Auctions/GetMoreAuctions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pageIndex: page, pageSize: pageSize, ClientNo: clientNo })
                });

                if (!response.ok) throw new Error('Status: ' + response.status);

                const data = await response.json();
                results.push(...data);

                if (data.length < pageSize) break; // last page
                page++;
            }

            hasCompanyField = results.some(a => getCompanyId(a) !== null);
            return results;
        }
        function renderNextPage() {

            appendAuctions(slice);
            renderIndex += slice.length;

                (renderIndex < filteredAuctions.length) ? '' : 'none';
        }
