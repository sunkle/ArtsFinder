<script>
(function(){
  var nonce = "efbfb413d771fd69";
  var challengeToken = "MTc5NTUyMTEwN3xlZmJmYjQxM2Q3NzFmZDY5fDN8NzZiYmU1ZGMwM2ZlMmIwMjFmMDE5MGIzODg5MzhkNzJlYmQ4OTdjNDZkZGM3YmE1ZTY4MjZhNDFjMmFkZjFlMA==";

    document.getElementById('bpbc-fallback').style.display = '';

  var encoder = new TextEncoder();
  var zeroBytes = difficulty >> 1;
  var oddNibble = (difficulty & 1) === 1;
