name: Collect lots and publish

on:
  schedule:
    # 01:17 and 02:17 UTC; the gate job lets only the one that is 02:17 in the UK through.
    - cron: "17 1 * * *"
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      diagnose:
        description: "Diagnose run: save sample pages of each house (downloadable as an artifact) and collect no data. Untick for a real collection."
        type: boolean
        default: true
      probe:
        description: "Probe run: politely test which auction houses allow automated access (saves probe/ to the 'probe' branch). Collects nothing and deploys nothing."
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        run: |
          hour=$(TZ=Europe/London date +%H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$hour" = "02" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

  collect:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ARTS_FINDER_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python3 -m unittest discover collector/tests
      - name: Collect lots
        if: github.event_name != 'workflow_dispatch' || (!inputs.diagnose && !inputs.probe)
        run: python3 -m collector.run
      - name: Diagnose (manual runs only)
        if: github.event_name == 'workflow_dispatch' && inputs.diagnose && !inputs.probe
        run: |
          set -o pipefail
          mkdir -p diagnose
          python3 -m collector.run --diagnose 2>&1 | tee diagnose/run.log
      - name: Upload diagnose pages (manual runs only)
        if: always() && github.event_name == 'workflow_dispatch' && inputs.diagnose && !inputs.probe
        uses: actions/upload-artifact@v4
        with:
          name: diagnose
          path: diagnose/
          if-no-files-found: warn
          retention-days: 14
      - name: Save diagnose folder to the 'diagnose' branch (manual runs only)
        if: always() && github.event_name == 'workflow_dispatch' && inputs.diagnose && !inputs.probe
        run: |
          mkdir -p diagnose
          tmp="$(mktemp -d)"
          cp -r diagnose "$tmp/diagnose"
          cd "$tmp"
          git init -q
          git checkout -q --orphan diagnose
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Diagnose run ${{ github.run_id }}"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" diagnose:diagnose
      - name: Probe houses (manual runs only)
        if: github.event_name == 'workflow_dispatch' && inputs.probe
        run: |
          set -o pipefail
          mkdir -p probe
          python3 -m collector.probe 2>&1 | tee probe.log
      - name: Save probe folder to the 'probe' branch (manual runs only)
        if: always() && github.event_name == 'workflow_dispatch' && inputs.probe
        run: |
          mkdir -p probe
          cp probe.log probe/run.log 2>/dev/null || true
          tmp="$(mktemp -d)"
          cp -r probe "$tmp/probe"
          cd "$tmp"
          git init -q
          git checkout -q --orphan probe
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Probe run ${{ github.run_id }}"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe:probe
      - name: Build the app
        if: github.event_name != 'workflow_dispatch' || !inputs.probe
        run: python3 app/build.py
      - name: Save data/lots.json if it changed
        if: github.event_name != 'workflow_dispatch' || !inputs.probe
        run: |
          git config user.name "arts-finder-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/lots.json
          if git diff --cached --quiet; then
            echo "No change in lots.json"
          else
            git commit -m "Update lots.json"
            git pull --rebase
            git push
          fi
      - uses: actions/configure-pages@v5
        if: github.event_name != 'workflow_dispatch' || !inputs.probe
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'workflow_dispatch' || !inputs.probe
        with:
          path: app/dist

  deploy:
    needs: collect
    if: github.event_name != 'workflow_dispatch' || !inputs.probe
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
